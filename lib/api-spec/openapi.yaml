openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: journeys
    description: Bus journey operations
  - name: Legal
    description: Public privacy, terms, support, and account deletion surfaces.
paths:
  /v2/actual-journeys:
    post:
      operationId: submitV2ActualJourney
      summary: Save a typed actual-journey report without inferring a timetable
      description: Authenticated public accounts can report actual clocks, named operator/places and scoped fares. Unknown trip context stays unknown. This capability permits no intended subject or an exact owned community lead until public canonical target discovery is implemented. Save is durable intake, not travel verification, service matching or publication. Reuse the account-scoped receipt lookup after an uncertain response.
      parameters:
        - $ref: '#/components/parameters/ExpectedAccountHeader'
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/V2ActualJourneyRequest'}
      responses:
        '200':
          description: Initial committed receipt or exact historical replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/V2LeadReceipt'}
        '400': {$ref: '#/components/responses/V2Error'}
        '401': {$ref: '#/components/responses/V2Error'}
        '403': {$ref: '#/components/responses/V2Error'}
        '404': {$ref: '#/components/responses/V2Error'}
        '409': {$ref: '#/components/responses/V2Error'}
        '413': {$ref: '#/components/responses/V2Error'}
        '415': {$ref: '#/components/responses/V2Error'}
        '422': {$ref: '#/components/responses/V2Error'}
        '428': {$ref: '#/components/responses/V2Error'}
        '503': {$ref: '#/components/responses/V2Error'}
  /v2/capabilities:
    get:
      operationId: getV2Capabilities
      summary: Discover the enabled minimum-lead intake contract
      responses:
        '200':
          description: Capability is false until explicitly enabled with the installed writer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Capabilities'
  /v2/cities:
    get:
      operationId: listV2Cities
      summary: Search cities with stable IDs for new-lead intake
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 80}
      responses:
        '200':
          description: Up to twenty matching reference cities, never inferred from free text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2Cities'
        '400': {$ref: '#/components/responses/V2Error'}
        '503': {$ref: '#/components/responses/V2Error'}
  /v2/contributions:
    post:
      operationId: submitV2Lead
      summary: Atomically save the four-answer lead and its initial receipt
      description: Server binds the authenticated account and current Terms. Saved does not mean associated, verified or published. This first capability supports minimum new leads only; other observations and target types remain separate future capabilities. No legacy fallback.
      parameters:
        - $ref: '#/components/parameters/ExpectedAccountHeader'
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V2MinimumLeadRequest'
      responses:
        '200':
          description: Committed initial receipt, including exact safe replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2LeadReceipt'
        '400': {$ref: '#/components/responses/V2Error'}
        '401': {$ref: '#/components/responses/V2Error'}
        '403': {$ref: '#/components/responses/V2Error'}
        '409': {$ref: '#/components/responses/V2Error'}
        '413': {$ref: '#/components/responses/V2Error'}
        '415': {$ref: '#/components/responses/V2Error'}
        '422': {$ref: '#/components/responses/V2Error'}
        '428': {$ref: '#/components/responses/V2Error'}
        '503': {$ref: '#/components/responses/V2Error'}
  /v2/receipts/{clientSubmissionId}:
    get:
      operationId: getV2LeadReceipt
      summary: Check this account's initial committed receipt before retrying
      description: Returns found=false for missing or other-account keys. The initial receipt is historical save confirmation, not a current processing or publication status. Erasure removes the receipt.
      parameters:
        - $ref: '#/components/parameters/ExpectedAccountHeader'
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: clientSubmissionId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Private account-scoped receipt lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V2ReceiptLookup'
        '400': {$ref: '#/components/responses/V2Error'}
        '401': {$ref: '#/components/responses/V2Error'}
        '503': {$ref: '#/components/responses/V2Error'}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser Google login flow through Supabase
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the Supabase Google authorization endpoint.

  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser Google login flow through Supabase
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the validated returnTo path on success.

  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the Mabhazi browser session
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the validated local return path.

  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a Supabase PKCE code for a Mabhazi session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /journeys:
    get:
      operationId: searchJourneys
      tags: [journeys]
      summary: Search for bus journeys
      parameters:
        - name: fromCity
          in: query
          required: false
          schema:
            type: string
        - name: toCity
          in: query
          required: false
          schema:
            type: string
        - name: day
          in: query
          required: false
          description: Filter by day of week, e.g. "Mon"
          schema:
            type: string
      responses:
        "200":
          description: List of matching journeys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneysEnvelope"
    post:
      operationId: createJourney
      tags: [journeys]
      summary: Contribute a new bus journey
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJourneyBody"
      responses:
        "201":
          description: Journey created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journey"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "428":
          description: Current terms acceptance required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /journeys/{id}/rate:
    post:
      operationId: rateJourney
      tags: [journeys]
      summary: Rate the accuracy of a bus journey
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateJourneyBody"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateJourneyResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "428":
          description: Current terms acceptance required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /journeys/{id}/confirm:
    post:
      operationId: confirmJourney
      tags: [journeys]
      summary: Confirm that a journey is currently operating
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Community confirmation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmJourneyResult"
        "401":
          description: Unauthorized
        "404":
          description: Journey not found
        "428":
          description: Current terms acceptance required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /journeys/{id}/claims:
    post:
      operationId: submitJourneyClaim
      tags: [journeys]
      summary: Submit a structured correction or observation about a journey
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneyClaimInput"
      responses:
        "201":
          description: Journey claim recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyClaimResult"
        "400":
          description: Invalid claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "428":
          description: Current terms acceptance required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "404":
          description: Journey not found

  /journeys/{id}/details:
    get:
      operationId: getJourneyDetails
      tags: [journeys]
      summary: Get community details for a bus journey
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Community comments and aggregate trip reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyDetails"
        "404":
          description: Journey not found

  /journeys/{id}/reports:
    post:
      operationId: submitJourneyReport
      tags: [journeys]
      summary: Submit a trip observation about a journey
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitJourneyReportBody"
      responses:
        "201":
          description: Trip observation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "428":
          description: Current terms acceptance required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /journeys/{id}/abuse-reports:
    post:
      operationId: submitAbuseReport
      tags: [journeys]
      summary: Report objectionable journey, comment, or contributor content
      description: Safety exception — abuse reports remain available to authenticated users without accepting the current community-contribution terms.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbuseReportBody"
      responses:
        "201":
          description: Abuse report recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbuseReportResult"
        "400":
          description: Invalid abuse report or target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
        "404":
          description: Journey, comment, or contributor not found

  /users/display-name:
    patch:
      operationId: updateDisplayName
      tags: [Auth]
      summary: Update the current user's display name (once per 30 days)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDisplayNameBody"
      responses:
        "200":
          description: Display name updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDisplayNameResult"
        "400":
          description: Invalid name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit — changed too recently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDisplayNameRateLimitError"

  /privacy:
    get:
      operationId: getPrivacyNotice
      tags: [Legal]
      summary: Get the public Mabhazi privacy notice
      responses:
        "200":
          description: Privacy notice
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/LegalSummary"

  /terms:
    get:
      operationId: getTerms
      tags: [Legal]
      summary: Get the public Mabhazi terms of use
      responses:
        "200":
          description: Terms of use
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/LegalSummary"

  /terms/status:
    get:
      operationId: getTermsAcceptanceStatus
      tags: [Legal]
      summary: Get the current terms version and this user's acceptance status
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: Current terms version and acceptance status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsAcceptanceStatus"

  /terms/accept:
    post:
      operationId: acceptTerms
      tags: [Legal]
      summary: Accept the current version of the Mabhazi Terms
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsAcceptanceBody"
      responses:
        "200":
          description: Current terms accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsAcceptanceStatus"
        "400":
          description: Missing terms version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Submitted version is obsolete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /support:
    get:
      operationId: getSupport
      tags: [Legal]
      summary: Get public Mabhazi support and reporting guidance
      responses:
        "200":
          description: Support guidance
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSummary"

  /delete-account:
    get:
      operationId: getDeleteAccountPage
      tags: [Legal]
      summary: Get the public account deletion page
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        "200":
          description: Account deletion page or sign-in prompt
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: deleteMabhaziAccount
      tags: [Legal]
      summary: Permanently delete the authenticated Mabhazi account and account-linked data
      description: Requires an explicit confirmation phrase. Browser-cookie requests also require the same-origin CSRF token issued by GET /delete-account. Shared route records can remain only after contributor attribution is anonymized.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountBody"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/DeleteAccountBody"
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccountResult"
            text/html:
              schema:
                type: string
        "400":
          description: Confirmation phrase missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Browser CSRF token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Deletion failed and was rolled back
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /cities:
    get:
      operationId: listCities
      tags: [journeys]
      summary: Search known cities (OSM-seeded reference data)
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search query — returns cities whose name starts with or contains this string (case-insensitive). Returns up to 10 results.
      responses:
        "200":
          description: List of matching city names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitiesEnvelope"

  /associations/pending:
    get:
      operationId: getPendingAssociations
      tags: [journeys]
      summary: Get pending route association proposals for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        "200":
          description: List of pending proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposedAssociationsEnvelope"
        "401":
          description: Unauthorized

  /associations/resolved:
    get:
      operationId: getResolvedAssociations
      tags: [journeys]
      summary: Get confirmed route associations for the current user's routes
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        "200":
          description: Confirmed proposals that can be reversed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposedAssociationsEnvelope"
        "401":
          description: Unauthorized

  /associations/{id}/confirm:
    post:
      operationId: confirmAssociation
      tags: [journeys]
      summary: Confirm a proposed route association
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Association confirmed and stop added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Proposal not found
        "409":
          description: Proposal already resolved
        "428":
          description: Current terms acceptance required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /associations/{id}/reject:
    post:
      operationId: rejectAssociation
      tags: [journeys]
      summary: Reject a proposed route association
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Association rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Proposal not found
        "409":
          description: Proposal already resolved
        "428":
          description: Current terms acceptance required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /associations/{id}/reverse:
    post:
      operationId: reverseAssociation
      tags: [journeys]
      summary: Reverse a previously confirmed route association
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Association reversed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Proposal not found
        "409":
          description: Association is not confirmed
        "428":
          description: Current terms acceptance required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /bus-companies:
    get:
      operationId: listBusCompanies
      tags: [journeys]
      summary: List all active bus companies
      responses:
        "200":
          description: List of active bus companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusCompaniesEnvelope"

components:
  parameters:
    ExpectedAccountHeader:
      name: X-Mabhazi-Account
      in: header
      required: true
      description: Expected signed-in account ID to reject a token/account switch during a pending operation. The server actor always comes from the authenticated session, never this assertion.
      schema: {type: string, minLength: 1, maxLength: 256}
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, displayName, lastNameChange]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        displayName:
          type: [string, 'null']
        lastNameChange:
