name: Backend validation
on:
  pull_request:
    paths:
      - 'artifacts/api-server/**'
      - 'lib/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-validation.yml'
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mabhazi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mabhazi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mabhazi -d mabhazi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mabhazi:ci-only-password@localhost:5432/mabhazi_test
      ADMIN_SECRET: ci-only-admin-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --dir artifacts/api-server run typecheck
      - name: Generate reproducible initial schema
        run: pnpm --dir lib/db exec drizzle-kit generate --config ./drizzle.config.ts
      - name: Report generated schema for migration review
        run: |
          node -e 'const fs=require("fs"); for(const f of fs.readdirSync("lib/db/migrations").filter(f=>f.endsWith(".sql"))) { console.log("MIGRATION_SQL_BEGIN"); console.log(fs.readFileSync("lib/db/migrations/"+f,"utf8")); console.log("MIGRATION_SQL_END"); }'
      - run: pnpm --dir lib/db run push
      - run: pnpm --dir artifacts/api-server exec tsx --test src/lib/origins.test.ts src/lib/supabaseAuth.test.ts src/lib/identityDeletion.test.ts src/routes/adminAuth.test.ts
      - run: pnpm --dir artifacts/api-server run test
      - run: pnpm --dir artifacts/api-server run build
