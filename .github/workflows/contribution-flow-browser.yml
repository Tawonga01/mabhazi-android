name: Contribution flow browser
on:
  pull_request:
    paths:
      - 'artifacts/mobile/**'
      - 'artifacts/api-server/**'
      - 'lib/**'
      - '.github/workflows/contribution-flow-browser.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mabhazi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mabhazi_flow_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mabhazi -d mabhazi_flow_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mabhazi:ci-only-password@localhost:5432/mabhazi_flow_browser
      ADMIN_SECRET: ci-only-admin-secret-not-for-production
      PUBLIC_ORIGIN: http://127.0.0.1:5000
      CONTRIBUTION_MINIMUM_LEAD_ENABLED: 'true'
      CONTRIBUTION_BROWSER_FIXTURE: ci-only
      EXPO_PUBLIC_API_BASE_URL: https://preview.mabhazi.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir lib/db run migrate
      - name: Export the actual mobile app for isolated browser testing
        run: pnpm --dir artifacts/mobile exec expo export --platform web --output-dir dist-flow-web
      - name: Install a separate pinned browser-test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/mabhazi-browser-runtime" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/mabhazi-browser-runtime/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_RUNTIME=$RUNNER_TEMP/mabhazi-browser-runtime" >> "$GITHUB_ENV"
      - name: Exercise form, save, lost acknowledgement and Terms recovery
        run: pnpm --dir artifacts/api-server exec tsx scripts/contribution-flow-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contribution-flow-browser-evidence
          path: flow-browser-evidence
          retention-days: 14
