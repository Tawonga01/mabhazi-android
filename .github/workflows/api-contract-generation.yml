name: API contract generation
on:
  pull_request:
    paths:
      - 'lib/api-spec/**'
      - 'lib/api-client-react/**'
      - 'lib/api-zod/**'
      - '.github/workflows/api-contract-generation.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - name: Generate actual clients and validators from OpenAPI
        run: pnpm --dir lib/api-spec exec orval --config ./orval.config.ts
      - name: Export generated code only for connector synchronization
        run: |
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const paths=cp.execFileSync('git',['ls-files','-m','-o','--exclude-standard'],{encoding:'utf8'}).trim().split('\n').filter(p=>/^lib\/(api-client-react|api-zod)\/src\/generated\/.*\.ts$/.test(p));
          const files=paths.map(path=>({path,content:fs.readFileSync(path,'utf8')}));
          console.log('ACTUAL_API_GENERATED_BASE64 '+Buffer.from(JSON.stringify(files)).toString('base64'));
          NODE
      - run: pnpm run typecheck:libs
