name: Android validation
on:
  pull_request:
    paths:
      - 'artifacts/mobile/**'
      - 'lib/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - run: pnpm --dir artifacts/mobile run typecheck
      - run: pnpm --dir artifacts/mobile run android:export
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.mabhazi.com
